{% extends "base.html" %}

{% block title %}{{ title }} - Duke Wiki{% endblock %}

{% block content %}
<h2>{{ title }}</h2>

<div class="wiki-content">
    {{ content|safe }}
</div>

<div class="action-buttons">
    <a href="{{ url_for('edit_page', title=title) }}" class="btn">✏️ Edit Page</a>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">🏠 Home</a>
</div>
{% endblock %}
